name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test (no keys -> honest not_configured)
        run: |
          PORT=8099 AUTH_SECRET=ci-secret node dist/index.js &
          sleep 2
          curl -fsS localhost:8099/v1/health | tee /dev/stderr | grep -q '"llm":{"configured":false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8099/v1/chat -H 'content-type: application/json' -d '{"message":"x"}')
          test "$code" = "401"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sahbi-backend backend
