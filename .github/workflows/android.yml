name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '**.md']
  pull_request:
    paths-ignore: ['backend/**', '**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit, widget and golden tests
        run: flutter test --reporter expanded

      - name: Debug APK
        run: flutter build apk --debug

      - name: Release keystore (only if secrets exist)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=store" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore secrets: the release APK is DEBUG-SIGNED and NOT FOR STORES."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK
        run: flutter build apk --release

      - name: Remove key.properties
        if: always()
        run: rm -f android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: sahbi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sahbi-release-apk-${{ steps.keystore.outputs.signed == 'store' && 'signed' || 'DEBUG-SIGNED-not-for-stores' }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  integration-test:
    # Runs the main-flow integration test on an Android emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test --reporter expanded
