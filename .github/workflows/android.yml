name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '**.md']
  pull_request:
    paths-ignore: ['backend/**', '**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the phone-download release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP's lint needs JDK 21 APIs (List.removeLast)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit, widget and golden tests
        run: flutter test --reporter expanded

      - name: Debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sahbi-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Release keystore (only if secrets exist)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=store" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore secrets: the release APK is DEBUG-SIGNED and NOT FOR STORES."
            echo "signed=debug" >> "$GITHUB_OUTPUT"
          fi

      # Optional repo variable SAHBI_BACKEND_URL (Settings → Secrets and
      # variables → Actions → Variables). Empty = set the URL later in the app.
      - name: Release APK (universal)
        run: |
          flutter build apk --release --dart-define=SAHBI_BACKEND_URL=${{ vars.SAHBI_BACKEND_URL }}
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/sahbi-universal.apk"

      - name: Release APK (arm64 only, smaller, for most phones)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 --dart-define=SAHBI_BACKEND_URL=${{ vars.SAHBI_BACKEND_URL }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/sahbi-arm64.apk"
          ls -la "$RUNNER_TEMP"/sahbi-*.apk

      - name: Remove key.properties
        if: always()
        run: rm -f android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: sahbi-release-apk-${{ steps.keystore.outputs.signed == 'store' && 'signed' || 'DEBUG-SIGNED-not-for-stores' }}
          path: ${{ runner.temp }}/sahbi-*.apk

      # Artifacts are zips that need a GitHub login; a release asset is a plain
      # .apk that a phone browser can download and install directly:
      #   https://github.com/<owner>/<repo>/releases/latest/download/sahbi-arm64.apk
      - name: Publish "latest" release (direct phone download)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          cd "$RUNNER_TEMP"
          note="Automatic build of ${GITHUB_SHA::7}."
          if [ "$SIGNED" != "store" ]; then
            note="$note DEBUG-SIGNED: fine for installing on your own phone, not for app stores."
          fi
          note="$note sahbi-arm64.apk = most phones (smaller). sahbi-universal.apk = any phone."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest sahbi-arm64.apk sahbi-universal.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SAHBI – latest build" --notes "$note" --latest

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/golden/failures/
          if-no-files-found: ignore

  integration-test:
    # Runs the main-flow integration test on an Android emulator.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # AGP's lint needs JDK 21 APIs (List.removeLast)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: flutter test integration_test --reporter expanded
