include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Generated by `flutter gen-l10n` (uses Flutter's own deprecated delegates).
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    # Public named params (baseUrl:, store:) map to private fields on purpose.
    prefer_initializing_formals: false
    prefer_single_quotes: true
    always_declare_return_types: true
    avoid_print: true
